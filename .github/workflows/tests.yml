# Runs the unit tests on every push and pull request.
# The tests use fake models, so only light packages are installed (no torch, YOLO, TrOCR or EasyOCR).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                       # get the repository
      - uses: actions/setup-python@v5                   # same Python as the conda env
        with:
          python-version: "3.11"
      - name: Install test dependencies (versions from requirements.txt / pip freeze)
        run: pip install pandas==3.1.1 numpy==2.4.6 RapidFuzz==3.14.6 pillow==12.3.0 PyYAML==6.0.3 pytest==9.2.0
      - name: Run tests
        run: python -m pytest -q
